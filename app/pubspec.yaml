name: payflex
description: >
  PayFlex — mobile-first microfinance app built on the BMONI Embedded API.
  Phase 1: user creation + on-device owner wallet + managed smart wallet
  provisioning. Phase 2: KYC wizard, NGN/USD rail onboarding, wallet home
  balances/history. Phase 3: transfers, QR Pay, PayTag. Phase 4: savings
  goals, loans, agent mode — all end to end against the PayFlex
  orchestration backend.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '^3.9.0'
  # mobile_scanner 7.x (Phase 3) needs >=3.29.0 — kept in sync here rather
  # than leaving a lower bound none of our own dependencies actually allow.
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # On-device EVM keypair generation, secure storage, and EIP-191 signing.
  # Never implement key generation/signing outside this package.
  bmoni_embedded_sdk: ^0.0.2

  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  # Camera/gallery capture for KYC document + selfie upload (Phase 2).
  image_picker: ^1.1.2
  # QR Pay (Phase 3): render a payment QR and scan one to pay.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
