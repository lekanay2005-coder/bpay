version: "3.8"

# Local dev infra only — Postgres for the app DB, Redis for cache/session.
# BMONI itself is a remote sandbox; nothing BMONI-related runs here.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflex
      POSTGRES_PASSWORD: payflex
      POSTGRES_DB: payflex
    ports:
      - "5432:5432"
    volumes:
      - payflex_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  payflex_postgres_data:
